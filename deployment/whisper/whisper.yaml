apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-block-whisper
spec:
  replicas: 1  # it transcribes one episode at a time; pod-block sends one at a time too
  strategy:
    type: Recreate  # the models volume is ReadWriteOnce
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whisper
          image: ghcr.io/dben/pod-block-whisper
          ports:
            - name: http
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: pod-block-whisper
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp  # each episode is saved here while it is transcribed
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 3Gi  # small: about 1 GB, plus the episode's audio decoded (about 0.25 GB an hour)
          startupProbe:  # the first start downloads the model
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: pod-block-whisper-models
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pod-block-whisper
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pod-block-whisper-models
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi  # small is about 0.5 GB, large-v3-turbo about 1.6 GB
