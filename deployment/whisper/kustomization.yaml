# The transcription service, for captions: `kubectl apply -k deployment/whisper/`, then set
# PODBLOCK_WHISPER_URL in ../kustomization.yaml. Its own folder and labels, so pod-block's Service never
# picks its pods. See whisper/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pod-block
labels:
  - pairs:
      app.kubernetes.io/name: pod-block-whisper
    includeSelectors: true
resources:
  - whisper.yaml
images:
  - name: ghcr.io/dben/pod-block-whisper
    newTag: latest  # CHANGE: pin a sha-… tag
configMapGenerator:
  - name: pod-block-whisper
    literals:
      - WHISPER_MODEL=large-v3-turbo  # or small: about twice as quick, more mistakes in names (whisper/README.md)
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_THREADS=6  # CHANGE: the cores it may use (an i5-8500T has 6); match the CPU limit if you set one
      - WHISPER_BEAM_SIZE=5  # 1 is about twice as quick
      - WHISPER_BATCH=8  # pieces of an episode transcribed at once; 0 for one after another
      - WHISPER_SPEAKERS=false  # true: also find who speaks when, for `podblock speakers` (not in captions yet)
      - SPEAKER_THRESHOLD=0.8  # higher, fewer speakers; try others with `podblock speakers ID --threshold`
