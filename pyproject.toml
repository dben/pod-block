[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pod-block"
version = "0.1.0"
description = "Find and remember audio that repeats across podcast episodes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "requests>=2.28"]

[project.optional-dependencies]
web = ["fastapi>=0.115", "pydantic>=2", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9",
       "itsdangerous>=2.1", "segno>=1.5"]
test = ["pytest", "httpx>=0.27"]
dev = ["ruff"]

[project.scripts]
podblock = "podblock.cli:main"

[tool.setuptools]
packages = ["podblock", "podblock.app", "podblock.web", "podblock.web.routes"]

[tool.setuptools.package-data]
"podblock.web" = ["templates/*.html", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads, fingerprints and cuts real audio, or starts worker processes; `-m 'not slow'` skips them"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]  # FastAPI's way of declaring parameters

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # imports after pytest.importorskip, which skips a module when the web extras aren't there
